:root{
  --cyan:#3d9bff; --cyan2:#8cc6ff; --blue:#1f6bff; --indigo:#6d8bff;
  --line:rgba(61,155,255,.28); --text:#eaf3ff; --muted:#8aa8cc;
  /* 兜底（JS 会立即覆盖为真实像素值）：1% 屏幕高度 / 1% 屏幕宽度 */
  --u:1vh; --vw:1vh; --sw:56.25vh; --sh:100vh;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;}
html,body{width:100%;height:100%;overflow:hidden;background:#030d1e;color:var(--text);
  font-synthesis:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","微软雅黑","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;}

#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  /* 与 #screen 同色系，使 9:16 留白区与屏幕无缝衔接，不出现黑色边框 */
  background:
    radial-gradient(120% 55% at 50% 0%, rgba(42,120,255,.22) 0%, transparent 66%),
    radial-gradient(90% 50% at 50% 100%, rgba(61,155,255,.14) 0%, transparent 68%),
    linear-gradient(180deg,#071e3c 0%,#05132a 46%,#020b1b 100%);}

#screen{position:relative;width:var(--sw,100vw);height:var(--sh,100vh);overflow:hidden;
  max-width:100vw;max-height:100svh;
  background:
    radial-gradient(115% 62% at 50% -8%, rgba(42,120,255,.30) 0%, transparent 64%),
    radial-gradient(90% 55% at 50% 108%, rgba(61,155,255,.20) 0%, transparent 66%),
    radial-gradient(60% 40% at 10% 44%, rgba(42,120,255,.12) 0%, transparent 70%),
    linear-gradient(180deg,#071e3c 0%,#05132a 46%,#020b1b 100%);
  box-shadow:0 0 90px rgba(61,155,255,.12) inset, 0 0 8vh rgba(61,155,255,.16), 0 0 1.2vh rgba(120,190,255,.18);}


#bgLayer{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;}

/* —— 背景光效 —— */
#bgFx{position:absolute;inset:0;overflow:hidden;}
#bgFx .aur{position:absolute;border-radius:50%;filter:blur(calc(4.6*var(--u)));mix-blend-mode:screen;}
#bgFx .aur.a1{width:calc(80*var(--u));height:calc(80*var(--u));left:calc(-34*var(--u));top:calc(-16*var(--u));
  background:radial-gradient(circle,rgba(31,107,255,.34),rgba(31,107,255,0) 68%);
  animation:drift1 26s ease-in-out infinite;}
#bgFx .aur.a2{width:calc(68*var(--u));height:calc(68*var(--u));right:calc(-28*var(--u));bottom:calc(-12*var(--u));
  background:radial-gradient(circle,rgba(61,155,255,.28),rgba(61,155,255,0) 70%);
  animation:drift2 32s ease-in-out infinite;}
#bgFx .aur.a3{width:calc(32*var(--u));height:calc(32*var(--u));left:50%;top:30%;margin-left:calc(-16*var(--u));
  background:radial-gradient(circle,rgba(140,198,255,.18),transparent 70%);
  animation:breathe 9s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(calc(4*var(--u)),calc(3*var(--u)),0) scale(1.12);}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1.05);}50%{transform:translate3d(calc(-5*var(--u)),calc(-4*var(--u)),0) scale(.94);}}

#bgFx .beam{position:absolute;border-radius:50%;filter:blur(calc(5*var(--u)));mix-blend-mode:screen;}
#bgFx .beam.b1{width:calc(58*var(--u));height:calc(32*var(--u));left:2%;top:14%;
  background:radial-gradient(ellipse at 50% 50%,rgba(61,155,255,.22),rgba(61,155,255,0) 70%);
  animation:breathe 12s ease-in-out infinite;}
#bgFx .beam.b2{width:calc(52*var(--u));height:calc(28*var(--u));right:-10%;bottom:20%;
  background:radial-gradient(ellipse at 50% 50%,rgba(31,107,255,.2),rgba(31,107,255,0) 72%);
  animation:breathe 15s ease-in-out infinite reverse;}

#bgFx .sweep{position:absolute;left:0;right:0;top:calc(-34*var(--u));height:calc(34*var(--u));
  background:linear-gradient(180deg,transparent,rgba(61,155,255,.05) 55%,rgba(140,198,255,.025) 72%,transparent);
  animation:sweepMove 15s linear infinite;}
@keyframes sweepMove{0%{transform:translateY(0);}100%{transform:translateY(calc(168*var(--u)));}}

#bgLayer .vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 78% 58% at 50% 44%,transparent 34%,rgba(1,5,12,.72) 100%);}
#bgLayer .scanline{position:absolute;inset:0;pointer-events:none;opacity:.4;
  background:repeating-linear-gradient(180deg,rgba(130,180,255,.05) 0 calc(.1*var(--u)),transparent calc(.1*var(--u)) calc(.4*var(--u)));}

#gridLines{position:absolute;inset:0;opacity:.06;
  background-image:linear-gradient(rgba(61,155,255,.75) calc(.1*var(--u)),transparent calc(.1*var(--u))),
    linear-gradient(90deg,rgba(61,155,255,.75) calc(.1*var(--u)),transparent calc(.1*var(--u)));
  background-size:calc(4.4*var(--u)) calc(4.4*var(--u));}
#particles{position:absolute;inset:0;}

.hud-corner{position:absolute;width:calc(5.6*var(--u));height:calc(5.6*var(--u));pointer-events:none;z-index:1;opacity:.85;
  transition:opacity .3s;}
.hud-corner b{position:absolute;background:var(--cyan);box-shadow:0 0 calc(.8*var(--u)) var(--cyan);}
.hud-corner .h1{height:calc(.18*var(--u));width:calc(2.8*var(--u));}.hud-corner .v1{width:calc(.18*var(--u));height:calc(2.8*var(--u));}
.hud-corner.tl{top:calc(1.6*var(--u));left:calc(1.6*var(--u));}.hud-corner.tl .h1{top:0;left:0;}.hud-corner.tl .v1{top:0;left:0;}
.hud-corner.tr{top:calc(1.6*var(--u));right:calc(1.6*var(--u));}.hud-corner.tr .h1{top:0;right:0;}.hud-corner.tr .v1{top:0;right:0;}
.hud-corner.bl{bottom:calc(1.6*var(--u));left:calc(1.6*var(--u));}.hud-corner.bl .h1{bottom:0;left:0;}.hud-corner.bl .v1{bottom:0;left:0;}
.hud-corner.br{bottom:calc(1.6*var(--u));right:calc(1.6*var(--u));}.hud-corner.br .h1{bottom:0;right:0;}.hud-corner.br .v1{bottom:0;right:0;}
.tick-scale{position:absolute;pointer-events:none;opacity:.4;z-index:1;}
.tick-scale span{display:block;background:var(--cyan);}
.tick-scale.t1{left:calc(2*var(--u));top:34%;height:14%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;}
.tick-scale.t2{right:calc(2*var(--u));top:34%;height:14%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;}

.view{position:absolute;inset:0;display:none;flex-direction:column;z-index:2;opacity:1;}
.view.active{display:flex;}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes spinR{to{transform:rotate(-360deg);}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.04);}}

/* ================= 封面 ================= */
#cover{cursor:pointer;align-items:center;}

.c-head{margin-top:calc(7*var(--u));text-align:center;z-index:5;width:100%;padding:0 calc(4*var(--u));}
.c-title{font-family:'SYTitle',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:calc(4.4*var(--u));font-weight:900;letter-spacing:calc(.38*var(--u));line-height:1.16;
  white-space:nowrap;color:#fff;
  text-shadow:0 0 calc(.6*var(--u)) rgba(61,155,255,.9),0 0 calc(1.8*var(--u)) rgba(61,155,255,.6),0 0 calc(4*var(--u)) rgba(61,155,255,.35);}
.c-sub{margin-top:calc(1.4*var(--u));font-size:calc(1.35*var(--u));letter-spacing:calc(.22*var(--u));color:var(--muted);
  line-height:1.9;font-weight:500;}
.c-sub span{display:block;}
.c-sub span:last-child{letter-spacing:calc(.34*var(--u));}

.c-globe{position:relative;width:calc(38*var(--u));height:calc(38*var(--u));margin:calc(5.8*var(--u)) auto 0;z-index:3;}
.ring{position:absolute;border-radius:50%;pointer-events:none;}
.ring.r1{inset:0;border:calc(.2*var(--u)) solid rgba(61,155,255,.5);box-shadow:0 0 calc(3*var(--u)) rgba(61,155,255,.18) inset;}
.ring.r1::after{content:'';position:absolute;inset:calc(.5*var(--u));border-radius:50%;
  border:calc(.09*var(--u)) dashed rgba(61,155,255,.32);animation:spin 34s linear infinite;}
.ring.r2{inset:8%;border:calc(.12*var(--u)) solid rgba(63,140,255,.45);animation:spinR 44s linear infinite;}
.ring.r2::before{content:'';position:absolute;width:calc(1*var(--u));height:calc(1*var(--u));border-radius:50%;
  background:var(--blue);box-shadow:0 0 calc(1.4*var(--u)) var(--blue);top:50%;left:calc(-.5*var(--u));}
.ring.r2::after{content:'';position:absolute;width:calc(.8*var(--u));height:calc(.8*var(--u));border-radius:50%;
  background:var(--cyan);box-shadow:0 0 calc(1.2*var(--u)) var(--cyan);top:50%;right:calc(-.4*var(--u));}
.ring.r3{inset:18%;border:calc(.1*var(--u)) solid rgba(123,140,255,.36);}
.ring.r3::before{content:'';position:absolute;width:calc(.7*var(--u));height:calc(.7*var(--u));border-radius:50%;
  background:var(--indigo);box-shadow:0 0 calc(1*var(--u)) var(--indigo);bottom:calc(-.35*var(--u));left:50%;}
.ring.r4{inset:28%;border:calc(.09*var(--u)) solid rgba(61,155,255,.2);}

/* 外圈刻度 */
.ticks{position:absolute;inset:calc(-1.2*var(--u));border-radius:50%;pointer-events:none;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(61,155,255,.85) 0 .45deg,transparent .45deg 3deg);
  -webkit-mask:radial-gradient(circle closest-side,transparent 0 93%,#000 94%);
  mask:radial-gradient(circle closest-side,transparent 0 93%,#000 94%);}

/* 粗细不等的发光弧段 */
.seg{position:absolute;border-radius:50%;border-style:solid;border-color:transparent;pointer-events:none;}
.seg.s1{inset:0;border-width:calc(.5*var(--u));border-top-color:rgba(61,155,255,.9);transform:rotate(36deg);
  filter:drop-shadow(0 0 calc(1.4*var(--u)) rgba(61,155,255,.7));}
.seg.s2{inset:0;border-width:calc(.26*var(--u));border-left-color:rgba(140,198,255,.62);transform:rotate(150deg);
  filter:drop-shadow(0 0 calc(.9*var(--u)) rgba(61,155,255,.5));}
.seg.s3{inset:0;border-width:calc(.15*var(--u));border-bottom-color:rgba(140,198,255,.5);transform:rotate(-26deg);}
.seg.s4{inset:8%;border-width:calc(.4*var(--u));border-right-color:rgba(61,155,255,.8);transform:rotate(6deg);

<script>
/* 统一尺寸基准：以真实可视区为准，保持 9:16 设计比例等比缩放，杜绝 iOS 上 100vh 偏差导致的错位/变形 */
(function(){
  var R=document.documentElement;
  function fit(){
    try{
      var vv=window.visualViewport;
      /* 三个来源取最小值，避免任何一端报出偏大的视口导致横向溢出 */
      var w=Math.floor(Math.min(
        (vv&&vv.width)||1e9,
        R.clientWidth||1e9,
        window.innerWidth||1e9
      ));
      var h=Math.floor(Math.min(
        (vv&&vv.height)||1e9,
        R.clientHeight||1e9,
        window.innerHeight||1e9
      ));
      if(!w||!h||w>1e8||h>1e8) return;
      var sw=Math.min(w,h*9/16);      /* 宽度受限：按 9:16 定宽 */
      var sh=sw*16/9;
      if(sh>h){ sh=h; sw=h*9/16; }    /* 高度受限：按 9:16 定高 */
      R.style.setProperty('--sw',sw.toFixed(2)+'px');
      R.style.setProperty('--sh',sh.toFixed(2)+'px');
      /* 以实际渲染出来的容器尺寸为最终基准（CSS 的 max-* 约束可能已截断），保证内部绝不溢出 */
      var el=document.getElementById('screen');
      var rw=sw, rh=sh;
      if(el){ var b=el.getBoundingClientRect(); if(b.width>1&&b.height>1){ rw=b.width; rh=b.height; } }
      R.style.setProperty('--u',(rh/100).toFixed(3)+'px');
      R.style.setProperty('--vw',(rw/100).toFixed(3)+'px');
    }catch(e){}
  }
  fit();
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,260);setTimeout(fit,640);});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',fit);
    window.visualViewport.addEventListener('scroll',fit);
  }
  document.addEventListener('DOMContentLoaded',fit);
  window.addEventListener('load',function(){ fit(); if(typeof drawZig==='function') drawZig(); });
  window.addEventListener('resize',function(){
    if(document.getElementById('screen') && document.getElementById('screen').dataset.view==='stage2' && typeof drawZig==='function'){
      requestAnimationFrame(drawZig);
    }
  });
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ if(typeof drawZig==='function') drawZig(); });
  }
})();
</script>

const $ = s => document.querySelector(s);
const screenEl = $('#screen');
const views = { cover:$('#cover'), stage2:$('#stage2'), stage3:$('#stage3') };
let curStage = 0, curNode = 0;

function show(id){
  screenEl.dataset.view = id;
  Object.keys(views).forEach(k=>{
    const el = views[k];
    if(k===id){
      el.classList.add('active');
      el.style.display = 'flex';
    } else {
      el.classList.remove('active');
      el.style.display = 'none';
    }
  });
  if(id === 'stage2') requestAnimationFrame(()=>requestAnimationFrame(drawZig));
}

const canvas = $('#particles'), ctx = canvas.getContext('2d');
let parts = [];
function resizeCanvas(){
  const r = screenEl.getBoundingClientRect();
  canvas.width = Math.round(r.width); canvas.height = Math.round(r.height);
  const sc = Math.max(.7, r.width/390);
  const n = Math.max(34, Math.round(r.width*r.height/9500));
  parts = [];
  for(let i=0;i<n;i++){
    parts.push({x:Math.random()*r.width, y:Math.random()*r.height,
      r:(Math.random()*2.3+1.05)*sc, vx:(Math.random()-.5)*.26, vy:(Math.random()-.5)*.26,
      a:Math.random()*.4+.34, tw:Math.random()*Math.PI*2});
  }
}
function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of parts){
    p.x += p.vx; p.y += p.vy; p.tw += .02;
    if(p.x<0||p.x>canvas.width) p.vx *= -1;
    if(p.y<0||p.y>canvas.height) p.vy *= -1;
    const a = p.a*(.62+.38*Math.sin(p.tw));
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.5,0,Math.PI*2);
    ctx.fillStyle = 'rgba(61,155,255,'+(a*0.15).toFixed(3)+')'; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = 'rgba(126,192,255,'+a.toFixed(3)+')'; ctx.fill();
  }
  requestAnimationFrame(drawParticles);
}
resizeCanvas(); drawParticles();
window.addEventListener('resize', resizeCanvas);

/* 5 个节点圆心在 .s2-body 内的纵向位置（左右交替构成蛇形） */
const S2_CY = [26, 40.4, 54.8, 69.2, 83.6];

function renderStage2(){
  const box = $('#s2Nodes');
  box.innerHTML = '';
  DATA.forEach((st,i)=>{
    const side = (i % 2 === 0) ? 'L' : 'R';
    const node = document.createElement('div');
    node.className = 's2-node';
    node.dataset.side = side;
    node.dataset.idx = i;
    node.style.setProperty('--cx', (side === 'L' ? '32%' : '68%'));
    node.style.setProperty('--cy', S2_CY[i] + '%');
    node.innerHTML =
      '<div class="s2-dot">'+ICON[st.icon]+'</div>'+
      '<div class="s2-name">'+st.name+'</div>'+
      '<div class="s2-en">'+st.en+'</div>'+
      '<div class="s2-year"><b>'+String(i+1).padStart(2,'0')+'</b>'+st.years+'</div>';
    node.addEventListener('click', ()=> openStage3(i));
    box.appendChild(node);
  });
  requestAnimationFrame(()=>requestAnimationFrame(drawZig));
}

/* 按真实圆心位置绘制贯通 1959→2025 的蛇形弧线（含跑马灯） */
let zigPath = null, zigLen = 0, zigPos = 0, zigDot = null, zigHalo = null, zigLastT = 0;

function drawZig(){
  const body = $('#s2Body'), svg = $('#s2Zig');
  if(!body || !svg) return;
  const dots = body.querySelectorAll('.s2-dot');
  if(!dots.length) return;
  const br = body.getBoundingClientRect();
  if(br.width < 2 || br.height < 2) return;
  svg.setAttribute('viewBox','0 0 '+br.width.toFixed(1)+' '+br.height.toFixed(1));

  const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || br.height/100;
  const pts = [];
  for(let i=0;i<dots.length;i++){
    const r = dots[i].getBoundingClientRect();
    pts.push({x:r.left+r.width/2-br.left, y:r.top+r.height/2-br.top, r:r.width/2});
  }
  const n = pts.length, A = pts[0], Z = pts[n-1];
  const yTop = Math.max(u*1.8, A.y - A.r - br.height*0.155);
  const w1 = Math.max(u*2.4, A.r*0.5);

  /* 顶部贯入段：1959 起点 → 首节点顶部 */
  let d = 'M'+A.x.toFixed(1)+' '+yTop.toFixed(1);
  const hTop = (A.y - A.r) - yTop;
  d += ' C'+(A.x+w1).toFixed(1)+' '+(yTop+hTop*0.34).toFixed(1)+
       ','+(A.x-w1).toFixed(1)+' '+(yTop+hTop*0.68).toFixed(1)+
       ','+A.x.toFixed(1)+' '+(A.y-A.r).toFixed(1);

  /* 首节点：圆内穿到侧向出口（被圆遮住，视觉上从圆心右侧穿出） */
  const s0 = (pts[1].x > A.x) ? 1 : -1;
  d += ' L'+(A.x + s0*A.r*1.16).toFixed(1)+' '+A.y.toFixed(1);

  /* 节点之间：水平切线的 S 形弧线 */
  for(let i=0;i<n-1;i++){
    const a = pts[i], b = pts[i+1], s = (b.x > a.x) ? 1 : -1;
    const ax = a.x + s*a.r*1.16, ay = a.y;
    const bx = b.x - s*b.r*1.16, by = b.y;
    if(i > 0) d += ' L'+ax.toFixed(1)+' '+ay.toFixed(1);
    const k = Math.abs(bx-ax)*0.62;
    d += ' C'+(ax+s*k).toFixed(1)+' '+ay.toFixed(1)+
         ','+(bx-s*k).toFixed(1)+' '+by.toFixed(1)+
         ','+bx.toFixed(1)+' '+by.toFixed(1);
  }

  /* 末端贯出段：末节点右侧向外甩出 → 2025 终点（避开阶段名称文字） */
  const g5 = Z.r*1.16;
  d += ' L'+(Z.x+g5).toFixed(1)+' '+Z.y.toFixed(1);
  const ex = Math.min(br.width - u*6, Z.x + u*12);
  const ey = br.height - u*2.6;
  d += ' C'+(Z.x+g5+u*1.6).toFixed(1)+' '+(Z.y+ (ey-Z.y)*0.28).toFixed(1)+
       ','+(ex-u*0.3).toFixed(1)+' '+(ey-u*3.2).toFixed(1)+
       ','+ex.toFixed(1)+' '+ey.toFixed(1);

  svg.innerHTML =
    '<path class="glow" d="'+d+'"/>'+
    '<path class="base" id="zigBase" d="'+d+'"/>'+
    '<path class="flow2" id="zigFlow2" d="'+d+'"/>'+
    '<path class="flow" id="zigFlow" d="'+d+'"/>'+
    '<circle class="run-halo" id="zigRunH" r="'+(u*2.4).toFixed(1)+'" cx="0" cy="0"/>'+
    '<circle class="run-dot" id="zigRun" r="'+(u*0.5).toFixed(1)+'" cx="0" cy="0"/>'+
    '<circle class="e-halo" cx="'+A.x.toFixed(1)+'" cy="'+yTop.toFixed(1)+'" r="'+(u*1.55).toFixed(1)+'"/>'+
    '<circle class="e-dot" cx="'+A.x.toFixed(1)+'" cy="'+yTop.toFixed(1)+'" r="'+(u*0.42).toFixed(1)+'"/>'+
    '<text class="e-txt" x="'+(A.x+u*2).toFixed(1)+'" y="'+yTop.toFixed(1)+'">1959</text>'+
    '<circle class="e-halo" cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="'+(u*1.55).toFixed(1)+'"/>'+
    '<circle class="e-dot" cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="'+(u*0.42).toFixed(1)+'"/>'+
    '<text class="e-txt" x="'+(ex+u*1.8).toFixed(1)+'" y="'+ey.toFixed(1)+'">2025</text>';

  zigPath = svg.querySelector('#zigBase');
  zigDot  = svg.querySelector('#zigRun');
  zigHalo = svg.querySelector('#zigRunH');
  try{ zigLen = zigPath.getTotalLength(); }catch(e){ zigLen = 0; }

  const flow = svg.querySelector('#zigFlow');
  const flow2 = svg.querySelector('#zigFlow2');
  if(zigLen > 10){
    const dash = Math.max(u*2.2, zigLen*0.05);
    const per = dash*3.2;
    flow.style.strokeDasharray = dash.toFixed(1)+' '+(per-dash).toFixed(1);
    document.documentElement.style.setProperty('--dashP', (-per).toFixed(1)+'px');
    const dash2 = Math.max(u*5.5, zigLen*0.11);
    const per2 = dash2*4.6;
    flow2.style.strokeDasharray = dash2.toFixed(1)+' '+(per2-dash2).toFixed(1);
    document.documentElement.style.setProperty('--dashP2', (-per2).toFixed(1)+'px');
  }
  if(zigPos > zigLen || zigPos < 0) zigPos = 0;
  /* 先把光点落到起点，避免动画首帧出现在 (0,0) */
  if(zigDot && zigLen > 10){
    const p = zigPath.getPointAtLength(zigPos);
    zigDot.setAttribute('cx', p.x.toFixed(1));
    zigDot.setAttribute('cy', p.y.toFixed(1));
    if(zigHalo){ zigHalo.setAttribute('cx', p.x.toFixed(1)); zigHalo.setAttribute('cy', p.y.toFixed(1)); }
  }
}

/* 跑马灯光点沿曲线巡游 */
function zigTick(t){
  requestAnimationFrame(zigTick);
  if(!zigPath || zigLen < 10 || !zigDot) return;
  if(!views.stage2.classList.contains('active')){ zigLastT = 0; return; }
  if(!zigLastT) zigLastT = t;
  let dt = t - zigLastT; zigLastT = t;
  if(dt > 120) dt = 120;
  zigPos += (zigLen/6200)*dt;
  if(zigPos > zigLen) zigPos -= zigLen;
  const p = zigPath.getPointAtLength(zigPos);
  zigDot.setAttribute('cx', p.x.toFixed(1));
  zigDot.setAttribute('cy', p.y.toFixed(1));
  if(zigHalo){ zigHalo.setAttribute('cx', p.x.toFixed(1)); zigHalo.setAttribute('cy', p.y.toFixed(1)); }
}
requestAnimationFrame(zigTick);

function openStage3(i){
  curStage = i; curNode = 0;
  $('#s3Name').textContent = DATA[curStage].name;
  $('#s3Sub').textContent = DATA[curStage].years + '  ·  ' + DATA[curStage].en;
  renderRail(); renderDetail(); show('stage3');
}
function renderRail(){
  const st = DATA[curStage];
  const rail = $('#s3Rail');
  rail.innerHTML = '';
  st.nodes.forEach((n,idx)=>{
    const d = document.createElement('div');
    d.className = 's3-dot' + (idx===curNode ? ' active' : '');
    d.innerHTML = '<span class="yr">'+n.year+'</span>';
    d.addEventListener('click', ()=> goNode(idx));
    rail.appendChild(d);
  });
}
function goNode(i){ curNode = i; renderRail(); renderDetail(); }
function renderDetail(){
  const st = DATA[curStage], n = st.nodes[curNode];
  $('#dYear').textContent = n.year;
  $('#dTitle').textContent = n.title;
  $('#dText').textContent = n.text;
  $('#dText').scrollTop = 0;
  $('#s3Prog').textContent = (curNode+1)+'/'+st.nodes.length;
  $('#navFill').style.width = ((curNode+1)/st.nodes.length*100)+'%';
  const det = $('#s3Detail');
  det.classList.remove('fade-in'); void det.offsetWidth; det.classList.add('fade-in');
}

$('#cover').addEventListener('click', ()=>{ renderStage2(); show('stage2'); });
$('#s2Back').addEventListener('click', ()=> show('cover'));
$('#s2Home').addEventListener('click', ()=> show('cover'));
$('#s3Back').addEventListener('click', ()=>{ renderStage2(); show('stage2'); });
$('#navPrev').addEventListener('click', ()=>{ const L = DATA[curStage].nodes.length; goNode((curNode-1+L)%L); });
$('#navNext').addEventListener('click', ()=>{ const L = DATA[curStage].nodes.length; goNode((curNode+1)%L); });

let touchX = 0, touchY = 0;
screenEl.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, {passive:true});
screenEl.addEventListener('touchend', e=>{
  if(!views.stage3.classList.contains('active')) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){
    if(dx < 0) $('#navNext').click(); else $('#navPrev').click();
  }
}, {passive:true});

window.addEventListener('keydown', e=>{
  if(views.stage3.classList.contains('active')){
    if(e.key==='ArrowRight') $('#navNext').click();
    if(e.key==='ArrowLeft') $('#navPrev').click();
    if(e.key==='Escape') $('#s3Back').click();
  } else if(views.stage2.classList.contains('active')){
    if(e.key==='Escape') show('cover');
  }
});

function route(){
  const h = (location.hash||'').replace('#','');
  if(h.indexOf('stage3')===0){
    const p = h.split('/');
    const si = Math.max(0, Math.min(DATA.length-1, (parseInt(p[1]||1,10)||1)-1));
    const ni = Math.max(0, Math.min(DATA[si].nodes.length-1, (parseInt(p[2]||1,10)||1)-1));
    curStage = si; curNode = ni;
    $('#s3Name').textContent = DATA[si].name;
    $('#s3Sub').textContent = DATA[si].years + '  ·  ' + DATA[si].en;
    renderRail(); renderDetail(); show('stage3');
  } else if(h === 'stage2'){
    renderStage2(); show('stage2');
  } else {
    show('cover');
  }
}
window.addEventListener('hashchange', route);
route();
</script>
